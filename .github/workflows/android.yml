name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional. Add these repository secrets so every build is signed with the
      # same key and installs over the previous one. See README.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      HD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      HD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      HD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "HD_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Run game simulation tests
        run: ./gradlew :app:testDebugUnitTest --tests com.nh.hoopscoach.SimTest --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk HoopsDynasty.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HoopsDynasty-apk
          path: HoopsDynasty.apk

      - name: Publish a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hoops Dynasty (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Install on Android: download HoopsDynasty.apk on your phone, open it, and allow installs from your browser if asked.
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
          files: HoopsDynasty.apk
