name: Build APK and PC

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional. Add these repository secrets so every build is signed with the
      # same key and installs over the previous one. See README.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      HD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      HD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      HD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "HD_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Run game simulation tests
        run: ./gradlew :app:testDebugUnitTest --tests com.nh.hoopscoach.SimTest --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk HoopsDynasty.apk

      - name: Build PC packages
        run: |
          ./gradlew :app:packageUberJarForCurrentOS --no-daemon
          # Best-effort Linux installer; the runnable jar is the required PC artifact.
          ./gradlew :app:packageDeb --no-daemon || echo "packageDeb skipped"

      - name: Collect PC artifacts
        run: |
          mkdir -p pc-dist
          # Deb installer when packageDeb produced one
          find app/build/compose/binaries -type f -name '*.deb' -exec cp {} pc-dist/ \; || true
          # Runnable uber jar for the CI OS (Linux)
          JAR=$(find app/build/compose/jars -type f -name 'HoopsDynasty-*.jar' | head -1)
          if [ -z "$JAR" ]; then
            echo "PC jar missing" >&2
            exit 1
          fi
          cp "$JAR" pc-dist/HoopsDynasty-pc.jar
          ls -la pc-dist

      - uses: actions/upload-artifact@v4
        with:
          name: HoopsDynasty-apk
          path: HoopsDynasty.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HoopsDynasty-pc
          path: pc-dist/*

      - name: Publish a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hoops Dynasty (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            **Android:** download `HoopsDynasty.apk` on your phone, open it, and allow installs from your browser if asked.
            **PC:** download `HoopsDynasty-pc.jar` (run with Java 17+: `java -jar HoopsDynasty-pc.jar`) or the Linux `.deb` when present.
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
          files: |
            HoopsDynasty.apk
            pc-dist/*
